<mat-card appearance="outlined">
  <mat-card-header >
    <mat-card-title class="title-with-icon">
      <mat-icon (click)="redirectedProductIndex()" matTooltip="Regresar a productos">arrow_back</mat-icon>
      Ajustes del producto {{productName}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if(isLoading)
    {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <div class="table-container mat-elevation-z8">
      <div class="search-add-container">
        <mat-form-field class="search-field" appearance="outline">
          <mat-label>Buscar</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input>
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
        <button mat-icon-button class="add-button-icon" matTooltip="Agregar nuevo ajuste de inventario" (click)="openModal(0)" color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div style="overflow-y: auto; height: 300px">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row">{{row.id}}</td>
          </ng-container>
          <ng-container matColumnDef="stock">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Cantidad</th>
            <td mat-cell *matCellDef="let row">{{row.stock}}</td>
          </ng-container>
          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio de compra</th>
            <td mat-cell *matCellDef="let row">{{row.purchasePrice | number: '1.2-2'}}</td>
          </ng-container>
          <ng-container matColumnDef="dateAdjustment">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha De Ajuste</th>
            <td mat-cell *matCellDef="let row">{{row.dateAdjustment | date: 'dd/MM/yyyy'}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <mat-icon class="btnEdit" (click)="openModal(row.id)" matTooltip="Editar">edit</mat-icon>
              <mat-icon class="btnDelete" (click)="confirmDeleteInventoryAdjustment(row.id)" matTooltip="Eliminar">delete</mat-icon>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns sticky:true"></tr>
          <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page inventory adjustment"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
