<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title class="title-with-icon">
      <mat-icon (click)="redirectedDeliveryList()" matTooltip="Regresar a la lista de domicialiarios">arrow_back</mat-icon>
      Gestion de liquidacion de {{this.deliveryName}}
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if(isLoading)
    {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <div class="table-container mat-elevation-z8">
      <div class="search-add-container">
        <mat-form-field class="search-field" appearance="outline">
          <mat-label>Buscar</mat-label>
          <input matInput (keyup)="applyFilter($event)" #event>
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
      </div>
      <div style="overflow-y: auto; height: 300px">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
            <td mat-cell *matCellDef="let row">{{row.id}}</td>
          </ng-container>
          <ng-container matColumnDef="total">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
            <td mat-cell *matCellDef="let row">{{row.total | number: '1.2-2'}}</td>
          </ng-container>
          <ng-container matColumnDef="paymentDate">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha de pago</th>
            <td mat-cell *matCellDef="let row">{{row.paymentDate | date: 'dd/MM/yyyy'}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <mat-icon class="btnDetails" matTooltip="Detalle" (click)="openModal(row.id)">info</mat-icon>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns sticky:true"></tr>
          <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[5,10,25,100]" aria-label="Selected payslips"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
