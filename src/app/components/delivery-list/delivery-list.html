<mat-card appearance="outlined">
  <mat-card-header class="header">
    <mat-card-title>Domiciliarios</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if(isLoading)
    {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <div class="table-container mat-elevation-z8">
      <div class="search-add-container">
        <mat-form-field class="search-field" appearance="outline">
          <mat-label>Buscar</mat-label>
          <input matInput (keyup)="applyFilter($event)" #input>
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
        <button mat-icon-button class="add-button-icon" (click)="openDialog(0)" matTooltip="Agregar nuevo administrador" color="primary">
          <mat-icon>add</mat-icon>
        </button>
      </div>
      <div style="overflow-y: auto; height: 300px">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="id">
            <th class="rowId" mat-header-cell *matHeaderCellDef mat-sort-header>Id</th>
            <td class="rowId" mat-cell *matCellDef="let row">{{row.id}}</td>
          </ng-container>
          <ng-container matColumnDef="fullname">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let row">{{row.fullname}}</td>
          </ng-container>
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
            <td mat-cell *matCellDef="let row">{{row.username}}</td>
          </ng-container>
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let row">{{row.email}}</td>
          </ng-container>
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Telefono</th>
            <td mat-cell *matCellDef="let row">{{row.cellphone}}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th class="rowButtons" mat-header-cell *matHeaderCellDef mat-sort-header>Acciones</th>
            <td class="rowButtons" mat-cell *matCellDef="let row">
              <div class="actions">
                <mat-icon class="btnEdit" (click)="openDialog(row.id)" matTooltip="Editar">edit</mat-icon>
                <mat-icon class="btnDelete" (click)="confirmDeleteUser(row.id)" matTooltip="Eliminar">delete</mat-icon>
                <mat-icon class="btnDelivery" (click)="redirectedLink(row.id, 2)" matTooltip="Domicilios">local_shipping</mat-icon>
                <mat-icon class="btnPayment" (click)="redirectedLink(row.id, 1)" matTooltip="Pagos">payment</mat-icon>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns sticky:true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="selected page of users"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
