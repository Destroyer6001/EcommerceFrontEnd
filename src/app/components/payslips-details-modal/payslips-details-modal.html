<h2 mat-dialog-title class="title-with-icon">
  <mat-icon (click)="closeModal()" matTooltip="Regresar">arrow_back</mat-icon>
  Detalle de la liquidacion
</h2>

<form [formGroup]="formDetails">
  <mat-dialog-content>
    <div class="row">
      <div class="column">
        <mat-form-field appearance="outline" class="fullwidth">
          <mat-label>Total</mat-label>
          <input matInput formControlName="total">
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="column">
        <mat-form-field appearance="outline" class="fullwidth">
          <mat-label>Fecha</mat-label>
          <input matInput formControlName="date" [matDatepicker]="picker">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="column">
        <div class="table-container mat-elevation-z8">
          <table mat-table [dataSource]="dataSource">
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef>id</th>
              <td mat-cell *matCellDef="let row">{{row.id}}</td>
            </ng-container>
            <ng-container matColumnDef="payValue">
              <th mat-header-cell *matHeaderCellDef>Valor a Pagar</th>
              <td mat-cell *matCellDef="let row">{{row.payValue| number: '1.2-2'}}</td>
            </ng-container>
            <ng-container matColumnDef="nameState">
              <th mat-header-cell *matHeaderCellDef>Estado</th>
              <td mat-cell *matCellDef="let row">{{row.nameState}}</td>
            </ng-container>
            <ng-container matColumnDef="payDay">
              <th mat-header-cell *matHeaderCellDef>Fecha de pago</th>
              <td mat-cell *matCellDef="let row">{{row.payDay | date: 'dd/MM/yyyy'}}</td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
          </table>
        </div>
      </div>
    </div>
  </mat-dialog-content>
</form>
