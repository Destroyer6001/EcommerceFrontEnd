<mat-card appearance="outlined">
  <mat-card-header class="header">
    <mat-card-title>Productos</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if (isLoading)
    {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <mat-form-field appearance="outline">
      <mat-label></mat-label>
      <input matInput (keyup)="applyFilter($event)" #input>
    </mat-form-field>
    <button mat-raised-button (click)="openModal(0)" color="primary">Agregar</button>
    <div class="table-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let row">{{row.id}}</td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let row">{{row.name}}</td>
        </ng-container>
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Categoria</th>
          <td mat-cell *matCellDef="let row">{{row.categoryName}}</td>
        </ng-container>
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
          <td mat-cell *matCellDef="let row">{{row.stock}}</td>
        </ng-container>
        <ng-container matColumnDef="sale">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
          <td mat-cell *matCellDef="let row">{{row.sale |  number:'1.2-2' }}</td>
        </ng-container>
        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Imagen</th>
          <td mat-cell *matCellDef="let row">
            <img [src]="row.image" (error)="onImgError($event)" width="65" height="65" alt="img">
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Acciones</th>
          <td mat-cell *matCellDef="let row">
            <mat-icon class="btnEdit" (click)="openModal(row.id)" matTooltip="Editar">edit</mat-icon>
            <mat-icon class="btnDelete" (click)="confirmDeleteProduct(row.id)" matTooltip="Borrar">delete</mat-icon>
            <mat-icon class="btnInventory" (click)="redirectInventoryAdjustment(row.id)" matTooltip="Ajuste de inventario">inventory_2</mat-icon>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns sticky:true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
