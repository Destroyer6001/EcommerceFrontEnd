<mat-card appearance="outlined">
  <mat-card-header class="header">
    <mat-card-title>Categorias</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    @if(isLoading) {
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }

    <mat-form-field appearance="outline">
      <mat-label></mat-label>
      <input matInput  (keyup)="applyFilter($event)"  #input>
    </mat-form-field>
    <button mat-raised-button (click)="openCategoryDialog(0)" color="primary">Agregar</button>
    <div class="table-container mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
          <td mat-cell *matCellDef="let row"> {{row.id}} </td>
        </ng-container>
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
          <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Descripcion </th>
          <td mat-cell *matCellDef="let row"> {{row.description}} </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Acciones </th>
          <td mat-cell *matCellDef="let row">
            <mat-icon class="btnEdit" (click)="openCategoryDialog(row.id)" matTooltip="Editar">edit</mat-icon>
            <mat-icon class="btnDelete" (click)="confirmDeleteCategory(row.id)" matTooltip="Borrar">delete</mat-icon>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns sticky:true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
  </mat-card-content>
</mat-card>
